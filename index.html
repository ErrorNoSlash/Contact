<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dias Stas — Contact</title>

    <!-- Open Graph / social share -->
    <meta name="description" content="Dias Stas — studying & writing code. An interactive terminal: type 'contact' for links to website, GitHub, GitLab, Mastodon, and mail.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Dias Stas — Contact">
    <meta property="og:description" content="Studying & writing code. An interactive terminal — type 'contact' for all my links.">
    <meta property="og:url" content="https://contact.errornoslash.be/">
    <meta property="og:image" content="https://contact.errornoslash.be/images/social-card.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Dias Stas — contact.errornoslash.be">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Dias Stas — Contact">
    <meta name="twitter:description" content="Studying & writing code.">
    <meta name="twitter:image" content="https://contact.errornoslash.be/images/social-card.png">

    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/style.css">

    <!--Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- JS scripts -->
    <script src="./scripts/background.js" defer></script>
    <script src="./scripts/cursor.js" defer></script>
    <script src="./scripts/getYear.js" defer></script>
    <script src="./scripts/terminal.js" defer></script>
</head>

<body>

    <canvas id="bg"></canvas>

    <div id="cursor" aria-hidden="true"></div>

    <main class="term">
        <div class="titlebar">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            <span class="title">visitor@errornoslash: ~</span>
            <button class="menu-toggle" id="menu-toggle" type="button" aria-label="commands menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
        </div>

        <div class="screen" id="screen">
            <div id="output"></div>
            <div class="input-line" id="input-line" style="display: none;">
                <span class="p-user">visitor@errornoslash</span><span class="p-path">:~$</span>
                <input id="cmdline" type="text" autocomplete="off" autocapitalize="off" autocorrect="off"
                    spellcheck="false" aria-label="terminal input">
            </div>
        </div>

        <div class="chips" aria-label="quick commands">
            <button data-cmd="help">help</button>
            <button data-cmd="about">about</button>
            <button data-cmd="contact">contact</button>
            <button data-cmd="neofetch">neofetch</button>
            <button data-cmd="website">website</button>
            <button data-cmd="github">github</button>
            <button data-cmd="clear">clear</button>
        </div>
    </main>

    <footer>
        <section id="mark">
            &copy;<span id="year"></span> - Dias Stas · built in a terminal
        </section>
    </footer>

</body>

</html>
